name: CI

on:
  push:
    branches: [main, production-v4]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoincome
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoincome_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ---------- 阻断性质量门槛：这些必须通过 ----------

      - name: Lint — blocking rules (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        env:
          AUTOINCOME_SECRET_KEY: test-secret-key-32-chars-long!!!
          AUTOINCOME_DB_URL: postgresql+asyncpg://autoincome:test@localhost:5432/autoincome_test
          AUTOINCOME_REDIS_URL: redis://localhost:6379/0
          AUTOINCOME_ENV: testing
        run: pytest --cov-report=xml

      # ---------- 非阻断的进阶报告：先如实度量，再逐步收紧 ----------
      # 存量问题数量较大，直接设为阻断会让 CI 恒红而失去意义。
      # 这些步骤失败不会让 CI 变红，但会在日志里给出准确的数量，便于逐步收敛。

      - name: Report — strict lint findings (non-blocking)
        continue-on-error: true
        run: |
          ruff check src tests \
            --select D,S,PL,RUF,BLE,ARG,PTH,C90,PT,SIM,UP,T20,ERA,FBT,ISC,PD,PGH,PIE,ASYNC,SLF,N \
            --statistics || true

      - name: Report — type check (non-blocking)
        continue-on-error: true
        run: mypy src || true

      - name: Report — security scan (non-blocking)
        continue-on-error: true
        run: bandit -r src || true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t autoincome:test .

      - name: Test Docker image
        run: docker run --rm autoincome:test python -c "import autoincome; print(autoincome.__version__)"
