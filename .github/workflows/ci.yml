name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src tests

      - name: Run ruff formatter check
        run: ruff format --check src tests

      - name: Run mypy type check
        run: mypy src

      - name: Run bandit security scan
        run: bandit -r src -f json -o bandit-report.json || true

      - name: Run safety check
        run: safety check || true

      - name: Run tests with coverage
        run: pytest --cov=autoincome --cov-report=xml --cov-report=term
        env:
          AUTOINCOME_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production-32chars

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t autoincome:test .

      - name: Test Docker image
        run: |
          docker run -d -p 8080:8080 -e AUTOINCOME_SECRET_KEY=test-secret-key-for-ci-only-do-not-use-in-production-32chars --name autoincome-test autoincome:test
          sleep 5
          curl -f http://localhost:8080/api/v1/health || exit 1
          docker stop autoincome-test
