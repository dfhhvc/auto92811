name: CI

on:
  push:
    branches: [main, production-v4]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoincome
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoincome_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src tests

      - name: Run type checker (mypy)
        run: mypy src

      - name: Run security scan (bandit)
        run: bandit -r src

      - name: Run tests with coverage
        env:
          AUTOINCOME_SECRET_KEY: test-secret-key-32-chars-long!!!
          AUTOINCOME_DB_URL: postgresql+asyncpg://autoincome:test@localhost:5432/autoincome_test
          AUTOINCOME_REDIS_URL: redis://localhost:6379/0
          AUTOINCOME_ENV: testing
        run: pytest --cov=autoincome --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t autoincome:test .

      - name: Test Docker image
        run: docker run --rm autoincome:test python -c "import autoincome; print(autoincome.__version__)"