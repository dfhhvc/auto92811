[package]
name = "autoincome-desktop"
version = "4.1.0"
description = "AutoIncome Desktop Client"
authors = ["AutoIncome Team"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "autoincome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true