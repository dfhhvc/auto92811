apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autoincome.fullname" . }}-secret
  labels:
    {{- include "autoincome.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ required "config.secretKey is required" .Values.config.secretKey | b64enc | quote }}
  {{- if .Values.llm.moonshot.enabled }}
  moonshot-api-key: {{ .Values.llm.moonshot.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.openrouter.enabled }}
  openrouter-api-key: {{ .Values.llm.openrouter.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.openai.enabled }}
  openai-api-key: {{ .Values.llm.openai.apiKey | b64enc | quote }}
  {{- end }}