[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoincome"
version = "3.0.0"
description = "AI-powered passive income opportunity aggregator with intelligent deduplication, scoring, and cross-platform recommendations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AutoIncome Contributors", email = "contact@autoincome.dev"}
]
keywords = ["passive-income", "side-hustle", "aggregator", "ai", "recommendation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.19",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    " bleach>=6.2.0",
    "markdown>=3.7.0",
    "apscheduler>=3.11.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "bandit>=1.8.0",
    "safety>=3.2.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
autoincome = "autoincome.cli:main"

[project.urls]
Homepage = "https://autoincome.dev"
Documentation = "https://docs.autoincome.dev"
Repository = "https://github.com/dfhhvc/auto92811"
Issues = "https://github.com/dfhhvc/auto92811/issues"
Changelog = "https://github.com/dfhhvc/auto92811/blob/main/CHANGELOG.md"
Docker = "https://hub.docker.com/r/dfhhvc/autoincome"

[tool.hatch.build.targets.wheel]
packages = ["src/autoincome"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM",
    "ARG", "PTH", "ERA", "PD", "PGH", "PIE", "PL", "PT", "RUF",
    "S", "ASYNC", "BLE", "FBT", "C90", "ISC", "T20", "SLF",
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=autoincome --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/autoincome"]
omit = ["*/tests/*", "*/test_*"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
