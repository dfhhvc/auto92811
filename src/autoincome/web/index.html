<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoIncome v4 — 被动收入机会聚合器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header {
            text-align: center;
            padding: 3rem 0;
            border-bottom: 1px solid #334155;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; font-size: 1.1rem; }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        .card h3 { color: #60a5fa; margin-bottom: 0.5rem; }
        .card p { color: #94a3b8; }
        .endpoint {
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: monospace;
            margin-top: 0.5rem;
            word-break: break-all;
        }
        .endpoint a { color: #60a5fa; text-decoration: none; }
        .endpoint a:hover { text-decoration: underline; }
        footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 1px solid #334155;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 AutoIncome v4.0</h1>
            <p class="subtitle">AI驱动的被动收入机会聚合器 — 生产级架构</p>
        </header>

        <div class="status-grid">
            <div class="card">
                <h3>📊 API 文档</h3>
                <p>Swagger UI 接口文档</p>
                <div class="endpoint"><a href="/api/docs">/api/docs</a></div>
            </div>
            <div class="card">
                <h3>📈 监控指标</h3>
                <p>Prometheus 指标端点</p>
                <div class="endpoint"><a href="/metrics">/metrics</a></div>
            </div>
            <div class="card">
                <h3>🔍 机会列表</h3>
                <p>获取推荐副业机会</p>
                <div class="endpoint"><a href="/api/v1/opportunities">GET /api/v1/opportunities</a></div>
            </div>
            <div class="card">
                <h3>❤️ 健康检查</h3>
                <p>服务状态监控</p>
                <div class="endpoint"><a href="/api/v1/health">GET /api/v1/health</a></div>
            </div>
        </div>

        <footer>
            <p>AutoIncome v4.0 · <a href="https://github.com/dfhhvc/auto92811" style="color:#60a5fa">GitHub</a></p>
        </footer>
    </div>
</body>
</html>
